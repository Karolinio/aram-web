<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!--
      ═══ NICHT INDEXIEREN — und das ist keine Vorsicht, sondern Pflicht ═══

      Solange das Impressum unvollstaendig ist (Geschaeftsfuehrer,
      Handelsregisternummer, USt-IdNr. fehlen), darf diese Seite nicht in einer
      Suchmaschine stehen. Eine gewerbliche deutsche Seite ohne vollstaendiges
      Impressum ist abmahnfaehig; eine, die niemand findet, ist eine Vorschau.

      Zusammen mit public/robots.txt heisst das: wer die Adresse hat, kann sie
      oeffnen. Sonst niemand.

      RAUS, sobald der Inhaber die vier Angaben geliefert hat und die Seite
      wirklich live geht. Bis dahin bleibt sie stehen.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aram · Orientalisches Gebäck &amp; Pizza in Bonn-Hardtberg</title>
    <meta
      name="description"
      content="Syrische Fata'er, Manakisch, Lahmacun und Pizza. Teig morgens von Hand gerollt, erst bei deiner Bestellung belegt. Bonn-Hardtberg." />
    <!-- Die Adressleiste des Handys nimmt die Farbe des Grundes an. Fassung 1
         stand hier auf Ofenschwarz; auf einer Cremeseite wäre das ein dunkler
         Balken über einer hellen Seite. -->
    <meta name="theme-color" content="#f7ece0" />
    <!-- Ihr eigenes Logo als Tab-Symbol. Ohne diese Zeile fragt jeder Browser
         nach /favicon.ico und bekommt eine 404. -->
    <link rel="icon" type="image/webp" href="/bilder/echt/logo.webp" />
    <!--
      ═══ Die Vorladung muss dem ersten Bild ENTSPRECHEN ═══

      Dieser Kommentar hat schon einmal eine falsche Vorladung dokumentiert
      (Mehl-Textur statt Ladenfront, 16.08.). Jetzt zum zweiten Mal: seit dem
      13.09. ist der Vorhang die Startseite, und das erste Bild sind das Logo
      und die zwei Haelften des Lahmacun. Die Ladenfront (team-laden) steht
      erst in „Der Laden", weit unten — sie hier vorzuladen belegte die
      teuerste Verbindung mit drei Dateien, die niemand im ersten Bild sieht.

      Eine falsche Vorladung ist schlimmer als keine.
    -->
    <link rel="preload" as="image" href="/bilder/echt/logo.webp" />
    <link rel="preload" as="image" href="/bilder/vorhang/scheibe-links.webp" />
    <link rel="preload" as="image" href="/bilder/vorhang/scheibe-rechts.webp" />
  </head>
  <body>
    <div id="wurzel"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
