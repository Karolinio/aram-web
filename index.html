<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!--
      ═══ NICHT INDEXIEREN — und das ist keine Vorsicht, sondern Pflicht ═══

      Solange das Impressum unvollstaendig ist (Geschaeftsfuehrer,
      Handelsregisternummer, USt-IdNr. fehlen), darf diese Seite nicht in einer
      Suchmaschine stehen. Eine gewerbliche deutsche Seite ohne vollstaendiges
      Impressum ist abmahnfaehig; eine, die niemand findet, ist eine Vorschau.

      Zusammen mit public/robots.txt heisst das: wer die Adresse hat, kann sie
      oeffnen. Sonst niemand.

      RAUS, sobald der Inhaber die vier Angaben geliefert hat und die Seite
      wirklich live geht. Bis dahin bleibt sie stehen.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aram — Orientalisches Gebäck & Pizza in Bonn-Hardtberg</title>
    <meta
      name="description"
      content="Syrische Fata'er, Manakisch, Lahmacun und Pizza. Teig morgens von Hand gerollt, erst bei deiner Bestellung belegt. Bonn-Hardtberg." />
    <!-- Die Adressleiste des Handys nimmt die Farbe des Grundes an. Fassung 1
         stand hier auf Ofenschwarz; auf einer Cremeseite wäre das ein dunkler
         Balken über einer hellen Seite. -->
    <meta name="theme-color" content="#f7ece0" />
    <!-- Ihr eigenes Logo als Tab-Symbol. Ohne diese Zeile fragt jeder Browser
         nach /favicon.ico und bekommt eine 404. -->
    <link rel="icon" type="image/webp" href="/bilder/echt/logo.webp" />
    <!--
      ═══ Die Vorladung muss dem <picture> im Hero ENTSPRECHEN ═══

      Sie tat es nicht mehr. Der Hero zeigt seit dem 16.08. ihre Ladenfront;
      hier stand weiter die Mehl-auf-Holz-Textur — und die Handy-Fassung davon
      (mehl-holz-klein.webp) war beim Umbau gelöscht worden. Ergebnis: am
      Rechner wurde ein Bild vorgeladen, das gar nicht mehr im Hero steht, und
      am Handy lief die Vorladung in einen 404.

      Eine falsche Vorladung ist schlimmer als keine: sie belegt die erste,
      teuerste Verbindung mit der falschen Datei. Die drei Zeilen decken sich
      jetzt exakt mit den drei Quellen in Backstube.tsx.
    -->
    <link
      rel="preload"
      as="image"
      href="/bilder/echt/team-laden-schmal.webp"
      media="(max-width: 640px)" />
    <link
      rel="preload"
      as="image"
      href="/bilder/echt/team-laden-900.webp"
      media="(min-width: 641px) and (max-width: 1100px)" />
    <link
      rel="preload"
      as="image"
      href="/bilder/echt/team-laden.webp"
      media="(min-width: 1101px)" />
    <link rel="preload" as="image" href="/bilder/echt/fatayer-frei.webp" />
  </head>
  <body>
    <div id="wurzel"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
